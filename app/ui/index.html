<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Context Service — Ops Console</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2d3141;
    --accent: #6c8ef5;
    --accent2: #5bd4a4;
    --warn: #f5a623;
    --danger: #f56c6c;
    --text: #e2e6f0;
    --text-muted: #7b82a0;
    --radius: 8px;
    --font: 'Inter', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 100px;
    background: #1e3a5f; color: var(--accent); font-weight: 500;
  }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .card h2 { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }

  .stat-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .stat { flex: 1; min-width: 100px; background: #12151f; border-radius: var(--radius); padding: 12px 16px; }
  .stat .val { font-size: 26px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  button {
    background: var(--accent); color: #fff; border: none; padding: 8px 16px;
    border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 600;
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); }

  input, select {
    background: #12151f; border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius); padding: 8px 12px; font-size: 13px; width: 100%;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }

  .badge-sev {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px;
    border-radius: 4px; text-transform: uppercase; letter-spacing: .05em;
  }
  .sev-critical { background: #3a1015; color: #f56c6c; }
  .sev-high     { background: #3a2010; color: #f5a623; }
  .sev-medium   { background: #2d2a10; color: #f5e023; }
  .sev-low      { background: #102a1e; color: #5bd4a4; }

  .status-ok         { color: var(--accent2); }
  .status-degraded   { color: var(--warn); }
  .status-unreliable { color: var(--danger); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { color: var(--text-muted); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  td { padding: 8px 10px; border-bottom: 1px solid #1a1d27; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #161926; }

  .mono { font-family: monospace; font-size: 12px; }
  .tag { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #1e2235; color: var(--text-muted); margin-right: 4px; }

  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #1e3a2e; border: 1px solid var(--accent2); color: var(--accent2);
    padding: 10px 18px; border-radius: var(--radius); font-size: 13px;
    display: none; z-index: 999;
  }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }

  details summary { cursor: pointer; color: var(--accent); font-size: 12px; margin-top: 4px; }
  details pre { background: #12151f; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; font-size: 11px; overflow: auto; max-height: 200px; margin-top: 6px; color: var(--text-muted); }

  .hh-section { margin-top: 16px; }
  .totals-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 600px) { .totals-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>Household Context Service</h1>
  <span class="badge">Ops Console</span>
</header>

<main>

<!-- Auth bar -->
<div class="card" style="margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
  <label style="font-size:13px; color:var(--text-muted); white-space:nowrap;">API Key</label>
  <input id="apiKey" type="password" style="max-width:320px;" placeholder="ops-key-local-001" value="ops-key-local-001">
  <input id="apiBase" style="max-width:220px;" value="http://127.0.0.1:8090" placeholder="Service URL">
  <button onclick="checkHealth()">Ping</button>
  <span id="healthBadge" style="font-size:12px;"></span>
</div>

<!-- Sync panel -->
<div class="grid grid-2" style="margin-bottom:16px;">
  <div class="card">
    <h2>Trigger Sync</h2>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <button id="syncCrm" onclick="triggerSync('crm')">Sync CRM</button>
      <button id="syncCustodian" onclick="triggerSync('custodian')">Sync Custodian</button>
    </div>
    <div id="syncResult" style="font-size:12px; color:var(--text-muted);"></div>
  </div>

  <div class="card">
    <h2>Recent Sync Runs</h2>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <button class="secondary" onclick="loadRuns()">Refresh</button>
    </div>
    <div id="runsTable"><div class="empty">No runs loaded.</div></div>
  </div>
</div>

<!-- Household lookup -->
<div class="card">
  <h2>Household Context</h2>
  <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
    <select id="hhSelect" style="max-width:260px;">
      <option value="">Select household…</option>
      <option value="H-1001">H-1001 — Chen Family</option>
      <option value="H-1002">H-1002 — Nakamura Trust</option>
      <option value="H-1003">H-1003 — Alvarez-Reyes Trust</option>
      <option value="H-1004">H-1004 — Davidson Estate (deleted)</option>
      <option value="H-1005">H-1005 — Kenji Sato</option>
      <option value="H-1006">H-1006 — Pemberton Advisors</option>
    </select>
    <input id="hhCustom" style="max-width:140px;" placeholder="or type ID">
    <button onclick="loadContext()">Load Context</button>
  </div>

  <div id="contextOutput"></div>
</div>

</main>

<div id="toast"></div>

<script>
const BASE = () => document.getElementById('apiBase').value.replace(/\/+$/, '');
const KEY  = () => document.getElementById('apiKey').value.trim();
const H    = () => ({ 'Authorization': 'Bearer ' + KEY(), 'Content-Type': 'application/json' });

function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.style.background = ok ? '#1e3a2e' : '#3a1015';
  el.style.borderColor = ok ? 'var(--accent2)' : 'var(--danger)';
  el.style.color = ok ? 'var(--accent2)' : 'var(--danger)';
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

async function checkHealth() {
  try {
    const r = await fetch(BASE() + '/health');
    const j = await r.json();
    document.getElementById('healthBadge').innerHTML = '<span style="color:var(--accent2)">● ' + j.status + '</span>';
  } catch(e) {
    document.getElementById('healthBadge').innerHTML = '<span style="color:var(--danger)">● unreachable</span>';
  }
}

async function triggerSync(source) {
  const btn = document.getElementById('sync' + (source === 'crm' ? 'Crm' : 'Custodian'));
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Running…';
  const el = document.getElementById('syncResult');
  el.textContent = '';
  try {
    const r = await fetch(BASE() + '/v1/ops/sync/' + source, { method:'POST', headers: H() });
    const j = await r.json();
    if (r.ok) {
      el.innerHTML = `<span style="color:var(--accent2)">✓</span> <b>${j.source}</b> — ${j.status} — ingested <b>${j.records_ingested}</b>, skipped <b>${j.records_skipped}</b>`;
      toast('Sync complete: ' + j.records_ingested + ' ingested');
      loadRuns();
    } else {
      el.innerHTML = `<span style="color:var(--danger)">✗ ${j.error?.code}: ${j.error?.message}</span>`;
      toast(j.error?.message, false);
    }
  } catch(e) {
    el.innerHTML = '<span style="color:var(--danger)">Network error: ' + e.message + '</span>';
    toast('Network error', false);
  }
  btn.disabled = false;
  btn.textContent = source === 'crm' ? 'Sync CRM' : 'Sync Custodian';
}

async function loadRuns() {
  try {
    const r = await fetch(BASE() + '/v1/ops/sync-runs?limit=10', { headers: H() });
    const runs = await r.json();
    if (!Array.isArray(runs) || runs.length === 0) {
      document.getElementById('runsTable').innerHTML = '<div class="empty">No runs yet.</div>';
      return;
    }
    const rows = runs.map(run => {
      const st = run.status === 'success' ? 'color:var(--accent2)' : run.status === 'running' ? 'color:var(--accent)' : 'color:var(--danger)';
      const ts = new Date(run.started_at).toLocaleTimeString();
      return `<tr>
        <td><span class="tag">${run.source.replace('ledgerline_','').replace('meridian_','')}</span></td>
        <td><span style="${st}">${run.status}</span></td>
        <td class="mono">${run.records_ingested}</td>
        <td class="mono">${ts}</td>
      </tr>`;
    }).join('');
    document.getElementById('runsTable').innerHTML = `
      <table>
        <thead><tr><th>Source</th><th>Status</th><th>Ingested</th><th>Time</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch(e) {
    document.getElementById('runsTable').innerHTML = '<div class="empty">Error loading runs.</div>';
  }
}

async function loadContext() {
  const hhId = document.getElementById('hhCustom').value.trim()
             || document.getElementById('hhSelect').value;
  if (!hhId) { toast('Select or enter a household ID', false); return; }

  const el = document.getElementById('contextOutput');
  el.innerHTML = '<span class="spinner"></span> Loading…';
  try {
    const r = await fetch(BASE() + '/v1/households/' + hhId + '/context', { headers: H() });
    const j = await r.json();
    if (!r.ok) {
      el.innerHTML = `<div style="color:var(--danger); font-size:13px;">Error ${r.status}: ${j.error?.code} — ${j.error?.message}</div>`;
      return;
    }
    renderContext(el, j);
  } catch(e) {
    el.innerHTML = '<div style="color:var(--danger); font-size:13px;">Network error: ' + e.message + '</div>';
  }
}

function severityBadge(sev) {
  return `<span class="badge-sev sev-${sev}">${sev}</span>`;
}

function renderContext(el, ctx) {
  const hh = ctx.household;
  const dq = ctx.data_quality;
  const dqClass = 'status-' + dq.status;

  let accountRows = '';
  (ctx.accounts || []).forEach(acc => {
    accountRows += `<tr>
      <td class="mono">…${acc.account_number_last4}</td>
      <td><span class="tag">${acc.registration_type || '—'}</span></td>
      <td><span class="tag">${acc.status}</span></td>
      <td class="mono">${acc.total_market_value ? '$' + Number(acc.total_market_value).toLocaleString() : '—'}</td>
    </tr>`;
  });

  let findingRows = '';
  (dq.findings || []).forEach(f => {
    findingRows += `<tr>
      <td>${severityBadge(f.severity)}</td>
      <td class="mono">${f.code}</td>
      <td style="font-size:12px;">${f.message}</td>
    </tr>`;
  });

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="val">${hh.name}</div><div class="lbl">Household</div></div>
      <div class="stat"><div class="val">$${Number(ctx.totals?.total_aum || 0).toLocaleString()}</div><div class="lbl">Total AUM</div></div>
      <div class="stat"><div class="val">${ctx.members?.length || 0}</div><div class="lbl">Members</div></div>
      <div class="stat"><div class="val"><span class="${dqClass}">${dq.status}</span></div><div class="lbl">Data Quality</div></div>
    </div>

    <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">
      Advisor: <b>${hh.primary_advisor || '—'}</b> &nbsp;|&nbsp;
      Risk: <b>${hh.risk_profile || '—'}</b> &nbsp;|&nbsp;
      Tier: <b>${hh.service_tier || '—'}</b> &nbsp;|&nbsp;
      Status: <b>${hh.status}</b>
    </div>

    ${ctx.accounts?.length ? `
    <div class="hh-section">
      <table>
        <thead><tr><th>Account</th><th>Type</th><th>Status</th><th>Market Value</th></tr></thead>
        <tbody>${accountRows}</tbody>
      </table>
    </div>` : '<div class="empty">No linked accounts.</div>'}

    ${(dq.findings || []).length ? `
    <div class="hh-section">
      <h2 style="margin-bottom:8px;">Data Quality Findings</h2>
      <table>
        <thead><tr><th>Severity</th><th>Code</th><th>Message</th></tr></thead>
        <tbody>${findingRows}</tbody>
      </table>
    </div>` : ''}

    <details style="margin-top:16px;">
      <summary>Raw JSON response</summary>
      <pre>${JSON.stringify(ctx, null, 2)}</pre>
    </details>`;
}

// Auto-load on page open
checkHealth();
</script>
</body>
</html>
